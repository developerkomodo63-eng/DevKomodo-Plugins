name: DevKomodo Ultimate - Release Builds

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-vst3:
    name: Windows x64 VST3
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      WINDOWS_CODESIGN_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_BASE64 }}
      WINDOWS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
      WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_CODESIGN_TIMESTAMP_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (MSVC x64)
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_CXX_STANDARD=17
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCMAKE_CONFIGURATION_TYPES=Release

      - name: Build all pedals (Release)
        shell: pwsh
        run: >-
          cmake --build build --config Release --parallel
          -- /m:4 /p:UseMultiToolTask=true /p:MultiProcessorCompilation=true

      - name: Validate VST3 output
        shell: pwsh
        run: |
          $expected = @(Select-String -Path "CMakeLists.txt" -Pattern '^add_subdirectory\(Pedals/[^\)]+\)').Count
          $vst3 = @(Get-ChildItem -Path "build" -Recurse -Directory -Filter "*.vst3" -ErrorAction SilentlyContinue)

          Write-Host "Expected plugin targets: $expected"
          Write-Host "Found VST3 bundles: $($vst3.Count)"

          if ($vst3.Count -ne $expected) {
            Write-Error "VST3 count mismatch: expected $expected, found $($vst3.Count)."
            exit 1
          }

          foreach ($plugin in $vst3) {
            $binary = Get-ChildItem -Path $plugin.FullName -Recurse -File -Filter "*.vst3" |
              Where-Object { $_.FullName -match "\\Contents\\x86_64-win\\" } |
              Select-Object -First 1

            if ($null -eq $binary) {
              Write-Error "Invalid Windows VST3 bundle: $($plugin.FullName)"
              exit 1
            }
          }

          Write-Host "All VST3 bundles passed structural validation."

      - name: Sign Windows VST3 binaries
        if: ${{ env.WINDOWS_CODESIGN_CERTIFICATE_BASE64 != '' && env.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD != '' }}
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "devkomodo-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERTIFICATE_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw "signtool.exe was not found on the runner." }

          $timestampArgs = @()
          if ($env:WINDOWS_CODESIGN_TIMESTAMP_URL -ne '') {
            $timestampArgs = @('/tr', $env:WINDOWS_CODESIGN_TIMESTAMP_URL, '/td', 'sha256')
          }
          Get-ChildItem -Path "build" -Recurse -File |
            Where-Object { $_.FullName -match "\\Contents\\x86_64-win\\" } |
            ForEach-Object {
              & $signtool.FullName sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD @timestampArgs $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Failed to sign $($_.FullName)" }
            }
          Remove-Item $certificatePath -Force

      - name: Collect VST3 bundles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "allvst3" | Out-Null
          $vst3 = Get-ChildItem -Path "build" -Recurse -Directory -Filter "*.vst3"

          foreach ($plugin in $vst3) {
            $destination = Join-Path "allvst3" $plugin.Name
            if (Test-Path $destination) {
              Write-Error "Duplicate VST3 output name: $($plugin.Name)"
              exit 1
            }
            Copy-Item -Path $plugin.FullName -Destination $destination -Recurse -Force
          }

          Get-ChildItem "allvst3" -Directory | Sort-Object Name | ForEach-Object {
            Write-Host $_.FullName
          }

      - name: Upload Windows VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevKomodo-Pedals-Windows-VST3
          path: allvst3
          if-no-files-found: error
          compression-level: 6

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "installer\DevKomodo-Pedals.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevKomodo-Pedals-Windows-Installer
          path: installer-output/*.exe
          if-no-files-found: error

  build-macos-au-vst3:
    name: macOS universal AU and VST3
    runs-on: macos-14
    timeout-minutes: 90
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (universal)
        run: >-
          cmake -S . -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_CONFIGURATION_TYPES=Release

      - name: Build AU and VST3
        run: cmake --build build --config Release --parallel 3

      - name: Validate AU and VST3 output
        shell: bash
        run: |
          expected=$(grep -c '^add_subdirectory(Pedals/' CMakeLists.txt)
          au_count=$(find build -type d -name '*.component' | wc -l | tr -d ' ')
          vst3_count=$(find build -type d -name '*.vst3' | wc -l | tr -d ' ')
          echo "Expected plugin targets: $expected"
          echo "Found AU bundles: $au_count"
          echo "Found VST3 bundles: $vst3_count"
          test "$au_count" -eq "$expected"
          test "$vst3_count" -eq "$expected"

      - name: Sign and notarize macOS plugins
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && env.APPLE_KEYCHAIN_PASSWORD != '' && env.APPLE_DEVELOPER_ID != '' && env.APPLE_NOTARY_KEY_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/devkomodo-signing.keychain-db"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/DevKomodo.p12"
          security import "$RUNNER_TEMP/DevKomodo.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          find build -type d \( -name '*.component' -o -name '*.vst3' \) -print0 |
            xargs -0 -n1 codesign --force --deep --options runtime --timestamp --sign "$APPLE_DEVELOPER_ID"
          mkdir -p notarization/AU notarization/VST3
          find build -type d -name '*.component' -exec cp -R {} notarization/AU/ \;
          find build -type d -name '*.vst3' -exec cp -R {} notarization/VST3/ \;
          ditto -c -k --keepParent notarization/AU notarization/DevKomodo-AU.zip
          ditto -c -k --keepParent notarization/VST3 notarization/DevKomodo-VST3.zip
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit notarization/DevKomodo-AU.zip --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait
          xcrun notarytool submit notarization/DevKomodo-VST3.zip --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait

      - name: Collect macOS plugins
        run: |
          mkdir -p allmacos
          find build -type d \( -name '*.component' -o -name '*.vst3' \) -exec cp -R {} allmacos/ \;

      - name: Validate universal macOS binaries
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' binary; do
            lipo -info "$binary" | grep -q 'arm64' || { echo "Missing arm64 in $binary"; exit 1; }
            lipo -info "$binary" | grep -q 'x86_64' || { echo "Missing x86_64 in $binary"; exit 1; }
          done < <(find allmacos -type f -path '*/Contents/MacOS/*' -print0)

      - name: Upload macOS AU/VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevKomodo-Pedals-macOS-AU-VST3
          path: allmacos
          if-no-files-found: error
