name: Build Waveform Synth - Windows VST3

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Waveform Synth / Windows x64 VST3
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_CXX_STANDARD=17
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
          -DCMAKE_CONFIGURATION_TYPES=Release

      - name: Build Waveform Synth (Release)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Validate Waveform Synth VST3
        shell: pwsh
        run: |
          $vst3 = @(Get-ChildItem -Path "build" -Recurse -Directory -Filter "Waveform Synth.vst3" -ErrorAction SilentlyContinue)

          if ($vst3.Count -ne 1) {
            Write-Error "Expected exactly one Waveform Synth.vst3 bundle, found $($vst3.Count)."
            Get-ChildItem -Path "build" -Recurse -Directory -Filter "*.vst3" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host $_.FullName
            }
            exit 1
          }

          $binary = Get-ChildItem -Path $vst3[0].FullName -Recurse -File |
            Where-Object { $_.FullName -match "\\Contents\\x86_64-win\\" } |
            Select-Object -First 1

          if ($null -eq $binary) {
            Write-Error "Waveform Synth VST3 bundle does not contain a Windows x64 binary."
            exit 1
          }

          Write-Host "Waveform Synth VST3: $($vst3[0].FullName)"
          Write-Host "Binary: $($binary.FullName)"

      - name: Run pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" `
            -OutFile "$env:RUNNER_TEMP/pluginval.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/pluginval.zip" -DestinationPath "$env:RUNNER_TEMP/pluginval" -Force
          $pluginval = Get-ChildItem -Path "$env:RUNNER_TEMP/pluginval" -Filter "pluginval.exe" -Recurse | Select-Object -First 1
          if ($null -eq $pluginval) {
            Write-Error "pluginval.exe was not found in the downloaded archive."
            exit 1
          }
          & $pluginval.FullName --strictness-level 5 --validate $vst3[0].FullName
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Collect VST3 artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $vst3 = Get-ChildItem -Path "build" -Recurse -Directory -Filter "Waveform Synth.vst3" | Select-Object -First 1
          Copy-Item -Path $vst3.FullName -Destination "artifacts/Waveform Synth.vst3" -Recurse -Force

      - name: Upload Waveform Synth VST3
        uses: actions/upload-artifact@v4
        with:
          name: WaveformSynth-Windows-VST3
          path: artifacts/
          if-no-files-found: error
