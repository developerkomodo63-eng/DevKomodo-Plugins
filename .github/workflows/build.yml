name: Build Juno Emu - Windows VST3

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Juno Emu / Windows x64 VST3
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DDEVKOMODO_ACTIVE_PLUGIN=JunoEmu
          -DCMAKE_CXX_STANDARD=17
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
          -DCMAKE_CONFIGURATION_TYPES=Release

      - name: Build Juno Emu (Release)
        shell: pwsh
        run: cmake --build build --config Release --target JunoEmu_VST3 --parallel

      - name: Validate Juno Emu VST3
        shell: pwsh
        run: |
          $artefactRoot = Join-Path $PWD "build/Pedals/JunoEmu/JunoEmu_artefacts/Release/VST3"
          $vst3 = @()

          if (Test-Path -LiteralPath $artefactRoot -PathType Container) {
            $vst3 = @(Get-ChildItem -LiteralPath $artefactRoot -Directory -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq "JunoEmu.vst3" })
          }

          if ($vst3.Count -eq 0) {
            $vst3 = @(Get-ChildItem -Path "build" -Recurse -Directory -Force -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -eq "JunoEmu.vst3" -and
                $_.FullName -match "[\\/]JunoEmu_artefacts[\\/]Release[\\/]VST3[\\/]"
              })
          }

          if ($vst3.Count -ne 1) {
            Write-Error "Expected exactly one Juno Emu VST3 bundle in Release/VST3, found $($vst3.Count)."
            Write-Host "Expected artifact directory: $artefactRoot"
            Write-Host "All VST3 bundles found under build (diagnostic only):"
            Get-ChildItem -Path "build" -Recurse -Directory -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like "*.vst3" } |
              ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }

          $binary = Get-ChildItem -LiteralPath $vst3[0].FullName -Recurse -File -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "[\\/]Contents[\\/]x86_64-win[\\/]" } |
            Select-Object -First 1

          if ($null -eq $binary) {
            Write-Error "Juno Emu VST3 bundle does not contain a Windows x64 binary."
            Get-ChildItem -LiteralPath $vst3[0].FullName -Recurse -File -Force -ErrorAction SilentlyContinue |
              Select-Object -First 100 FullName |
              ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }

          "JUNO_EMU_VST3=$($vst3[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Juno Emu VST3: $($vst3[0].FullName)"
          Write-Host "Binary: $($binary.FullName)"

      - name: Run pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" `
            -OutFile "$env:RUNNER_TEMP/pluginval.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/pluginval.zip" -DestinationPath "$env:RUNNER_TEMP/pluginval" -Force
          $pluginval = Get-ChildItem -Path "$env:RUNNER_TEMP/pluginval" -Filter "pluginval.exe" -Recurse | Select-Object -First 1
          if ($null -eq $pluginval) {
            Write-Error "pluginval.exe was not found in the downloaded archive."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:JUNO_EMU_VST3)) {
            Write-Error "JUNO_EMU_VST3 is not set."
            exit 1
          }
          & $pluginval.FullName --strictness-level 5 --validate $env:JUNO_EMU_VST3
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Collect VST3 artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          if ([string]::IsNullOrWhiteSpace($env:JUNO_EMU_VST3)) {
            Write-Error "JUNO_EMU_VST3 is not set."
            exit 1
          }
          Copy-Item -Path $env:JUNO_EMU_VST3 -Destination "artifacts/Juno Emu.vst3" -Recurse -Force

      - name: Upload Juno Emu VST3
        uses: actions/upload-artifact@v4
        with:
          name: JunoEmu-Windows-VST3
          path: artifacts/
          if-no-files-found: error
